[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "exit-capsule-generator"
version = "1.0.0"
description = "AI-Powered Python Dependency Resilience and Migration Planning Tool"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=1.10.0,<2.0.0",
    "httpx>=0.27.0",
    "packaging>=23.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
exit-capsule = "app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
norecursedirs = ["fixtures", "sample_project", ".git", ".venv", "venv"]
